name: Fetch AIS Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install websockets

      - name: Fetch AIS + enrich metadata
        env:
          AIS_API_KEY:    ${{ secrets.AIS_API_KEY }}
          DATALASTIC_KEY: ${{ secrets.DATALASTIC_KEY }}
        run: python fetch_ais.py

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vessels.json data/alerts.json data/vessels_meta.json
          git diff --staged --quiet || git commit -m "chore: AIS snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
